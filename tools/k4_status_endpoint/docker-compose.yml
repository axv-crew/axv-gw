# Docker Compose dla testowania K4.1 AXV Status Endpoint
# 
# Usage:
#   docker-compose up -d
#   curl http://localhost:8080/axv/status | jq

version: '3.8'

services:
  # ============================================================================
  # AXV API - główny service z /axv/status endpoint
  # ============================================================================
  axv_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axv_api
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_HEALTHZ_URL=http://axv_gateway:8000/axv/healthz
      - N8N_HEALTHZ_URL=http://n8n:5678/healthz
      - HEALTHCHECK_TIMEOUT=2.0
      - LOG_LEVEL=INFO
    depends_on:
      - axv_gateway
      - n8n
    networks:
      - axv_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/axv/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # AXV Gateway - reverse proxy/router
  # ============================================================================
  axv_gateway:
    image: nginx:alpine
    container_name: axv_gateway
    ports:
      - "8000:8000"
    volumes:
      - ./gateway-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - axv_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/axv/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # n8n - workflow automation
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - axv_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Redis (opcjonalnie - dla cache statusów)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: axv_redis
    ports:
      - "6379:6379"
    networks:
      - axv_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Prometheus (opcjonalnie - dla metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: axv_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - axv_network

  # ============================================================================
  # Grafana (opcjonalnie - dla dashboardów)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: axv_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - axv_network

networks:
  axv_network:
    driver: bridge

volumes:
  n8n_data:
  prometheus_data:
  grafana_data:
