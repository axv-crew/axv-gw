# Grafana Alert Rules dla AXV Status K4.1
# 
# Import do Grafany przez UI lub API

groups:
  - name: axv_status_alerts
    interval: 30s
    rules:
      
      # ======================================================================
      # Critical Alerts - System Down
      # ======================================================================
      
      - alert: AXVSystemDown
        expr: axv_status_ok == 0
        for: 1m
        labels:
          severity: critical
          team: axv-crew
          component: system
        annotations:
          summary: "AXV System is DOWN"
          description: "The AXV system overall status is DOWN. One or more critical components are not responding."
          runbook_url: "https://docs.axv.systems/runbooks/system-down"
          dashboard: "https://gw.axv.life/grafana/d/axv-status"
      
      - alert: AXVAPIDown
        expr: axv_component_status{component="api"} == 0
        for: 2m
        labels:
          severity: critical
          team: axv-crew
          component: api
        annotations:
          summary: "AXV API is DOWN"
          description: "The AXV API component is not responding."
          runbook_url: "https://docs.axv.systems/runbooks/api-down"
      
      - alert: AXVGatewayDown
        expr: axv_component_status{component="gateway"} == 0
        for: 2m
        labels:
          severity: critical
          team: axv-crew
          component: gateway
        annotations:
          summary: "AXV Gateway is DOWN"
          description: "The AXV Gateway (reverse proxy) is not responding."
          runbook_url: "https://docs.axv.systems/runbooks/gateway-down"
      
      - alert: N8NDown
        expr: axv_component_status{component="n8n"} == 0
        for: 5m
        labels:
          severity: high
          team: axv-crew
          component: n8n
        annotations:
          summary: "n8n Workflow Engine is DOWN"
          description: "The n8n workflow automation engine is not responding. Automated workflows may be affected."
          runbook_url: "https://docs.axv.systems/runbooks/n8n-down"
      
      # ======================================================================
      # Warning Alerts - System Degraded
      # ======================================================================
      
      - alert: AXVSystemDegraded
        expr: axv_status_overall == 1 AND axv_status_ok == 1
        for: 5m
        labels:
          severity: warning
          team: axv-crew
          component: system
        annotations:
          summary: "AXV System is DEGRADED"
          description: "The AXV system is operational but one or more components are experiencing issues."
          runbook_url: "https://docs.axv.systems/runbooks/system-degraded"
      
      - alert: AXVAPIDegraded
        expr: axv_component_status{component="api"} == 0.5
        for: 10m
        labels:
          severity: warning
          team: axv-crew
          component: api
        annotations:
          summary: "AXV API is DEGRADED"
          description: "The AXV API is responding slowly or with errors."
      
      - alert: AXVGatewayDegraded
        expr: axv_component_status{component="gateway"} == 0.5
        for: 10m
        labels:
          severity: warning
          team: axv-crew
          component: gateway
        annotations:
          summary: "AXV Gateway is DEGRADED"
          description: "The AXV Gateway is experiencing performance issues."
      
      - alert: N8NDegraded
        expr: axv_component_status{component="n8n"} == 0.5
        for: 15m
        labels:
          severity: warning
          team: axv-crew
          component: n8n
        annotations:
          summary: "n8n is DEGRADED"
          description: "n8n workflow engine is experiencing issues."
      
      # ======================================================================
      # Info Alerts - Recovery & Unknown Status
      # ======================================================================
      
      - alert: AXVSystemRecovered
        expr: axv_status_ok == 1 AND axv_status_overall == 0
        for: 2m
        labels:
          severity: info
          team: axv-crew
          component: system
        annotations:
          summary: "AXV System RECOVERED"
          description: "The AXV system has recovered from a previous issue."
      
      - alert: RAGStatusUnknown
        expr: axv_component_status{component="rag"} == -1
        for: 30m
        labels:
          severity: info
          team: axv-crew
          component: rag
        annotations:
          summary: "RAG Status Unknown"
          description: "The RAG component status has been unknown for an extended period. This may indicate missing health check implementation."
      
      # ======================================================================
      # Performance Alerts
      # ======================================================================
      
      - alert: StatusEndpointSlow
        expr: histogram_quantile(0.95, rate(axv_status_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: axv-crew
          component: api
        annotations:
          summary: "Status Endpoint Slow Response"
          description: "The /axv/status endpoint is responding slowly (p95 > 2s)."
      
      # ======================================================================
      # Availability Alerts (SLO-based)
      # ======================================================================
      
      - alert: LowSystemAvailability
        expr: (rate(axv_status_ok[1h]) * 100) < 99
        for: 5m
        labels:
          severity: high
          team: axv-crew
          component: system
        annotations:
          summary: "Low System Availability"
          description: "System availability has fallen below 99% in the last hour (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://docs.axv.systems/runbooks/low-availability"


