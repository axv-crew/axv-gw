# Prometheus configuration dla AXV K4.1 Status Monitoring
# 
# Scrape /axv/status endpoint co 15s i twórz metryki

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'axv'
    environment: 'production'

# Alertmanager configuration (opcjonalnie)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (opcjonalnie)
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # ============================================================================
  # AXV API - główny endpoint /axv/status
  # ============================================================================
  - job_name: 'axv_api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'  # jeśli masz Prometheus exporter
    static_configs:
      - targets: ['axv_api:8080']
        labels:
          service: 'axv-api'
          component: 'api'

  # ============================================================================
  # AXV Gateway
  # ============================================================================
  - job_name: 'axv_gateway'
    scrape_interval: 15s
    static_configs:
      - targets: ['axv_gateway:8000']
        labels:
          service: 'axv-gateway'
          component: 'gateway'

  # ============================================================================
  # Custom JSON exporter dla /axv/status
  # Używa json_exporter do konwersji JSON response na metryki
  # ============================================================================
  - job_name: 'axv_status_json'
    scrape_interval: 30s
    metrics_path: '/probe'
    params:
      module: [default]
    static_configs:
      - targets:
          - 'http://axv_api:8080/axv/status'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json_exporter:7979  # jeśli używasz json_exporter

  # ============================================================================
  # n8n
  # ============================================================================
  - job_name: 'n8n'
    scrape_interval: 30s
    static_configs:
      - targets: ['n8n:5678']
        labels:
          service: 'n8n'
          component: 'automation'

  # ============================================================================
  # Redis
  # ============================================================================
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          component: 'cache'

  # ============================================================================
  # Prometheus self-monitoring
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
